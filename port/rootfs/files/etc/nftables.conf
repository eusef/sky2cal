#!/usr/sbin/nft -f
# Inbound: SSH (plus replies, loopback, ping and IPv6 neighbour discovery). On the USB cable
# (usb0) only: the settings page (tcp 80) and its DHCP server (udp 67). Nothing is forwarded.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iif "lo" accept
		ct state invalid drop
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		udp dport 68 accept
		udp dport 546 accept
		tcp dport 22 accept
		iifname "usb0" tcp dport 80 accept
		iifname "usb0" udp dport 67 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
