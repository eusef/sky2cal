# Example config: copy to config.toml (which is git-ignored). Feeds are read-only iCalendar URLs (https only).
# For a private Google calendar use its "Secret address in iCal format"; that URL is a secret.
timezone = "America/Los_Angeles"   # ASSUMED; change to the home's zone
first_weekday = 6                  # Monday=0 .. Sunday=6
cache_dir = "cache"
feeds = [
  "https://calendar.google.com/calendar/ical/%23moonphase%40group.v.calendar.google.com/public/basic.ics",
]
# refresh_minutes = 10             # how often the feeds are fetched again
# weather_place = "Springfield, Illinois"   # town for the hourly forecast (from open-meteo.com); also a postal
#                                  # code or "latitude, longitude". Not set: no weather, nothing is sent
# weather_units = "fahrenheit"     # or "celsius"
#                                  # weather_place in the United States also brings the NOAA weather
#                                  # alerts for it (from api.weather.gov)
# theme = "original"               # or tactical, sports, fantasy, neon, starship (skycal/themes/__init__.py)
# screensaver_minutes = 10         # minutes without a touch before the screensaver; 0 = never
# touch_flip_x = true              # touch panel orientation against the framebuffer; both default
# touch_flip_y = true              # to true, which is what the Skylight Frame 2 needs
# [feed_colors]                    # a colour per calendar, keyed by the first 16 hex digits of the SHA-256
# 4f608dad13bb71f2 = "#e67c73"     # of its address (the settings page sets these); an event with a COLOR
#                                  # of its own in the feed keeps that
